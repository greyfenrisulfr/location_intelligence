changelog:
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - fix
        - bug
    - title: Documentation
      labels:
        - docs
    - title: Maintenance
      labels:
        - maintenance
        - chore
    - title: Breaking Changes
      labels:
        - breaking
  exclude:
    labels:
      - skip-changelog
template: |
  ## Changes

  $CHANGES

  ## Notes

  - Packaged `custom_components/location_intelligence` artifact is attached to the release.
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
