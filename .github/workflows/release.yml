name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate tagged version
        run: python scripts/validate_release.py "${GITHUB_REF_NAME#v}"

      - name: Compile Python sources
        run: python -m compileall custom_components tests

      - name: Package integration
        run: |
          mkdir -p dist
          cd custom_components
          zip -r ../dist/location_intelligence-${GITHUB_REF_NAME#v}.zip location_intelligence

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/location_intelligence-*.zip
